[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abstrivo-backend"
version = "0.1.0"
description = "FastAPI backend for Abstrivo document intelligence"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2.0",
    "arq>=0.26,<1.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<0.116",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
